<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Anatomy X-ray</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070c'/%3E%3Ccircle cx='16' cy='14' r='8' fill='none' stroke='%237fd4ff' stroke-width='2.5'/%3E%3Cpath d='M12 22v4m4-4v4m4-4v4' stroke='%237fd4ff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="labels"></canvas>

    <section id="intro">
      <h1>Anatomy X-ray</h1>
      <p>See the skeleton under your skin, or your dog’s or cat’s, live. Video stays on this device.</p>
      <div class="starts">
        <button id="start" class="primary">X-ray me</button>
        <button id="startPet" class="primary">X-ray my pet</button>
      </div>
      <label class="pick">or choose a photo or video<input id="file" type="file" accept="image/*,video/*" /></label>
      <p id="status" role="status"></p>
    </section>

    <p id="hud" role="status"></p>

    <nav id="controls" hidden>
      <div class="segmented" role="group" aria-label="Subject">
        <button data-mode="human" aria-pressed="true">Human</button>
        <button data-mode="animal" aria-pressed="false">Dog / Cat</button>
      </div>
      <div class="segmented human-only" role="group" aria-label="Face reveal">
        <button data-face="half" aria-pressed="true">Half</button>
        <button data-face="full" aria-pressed="false">Full</button>
        <button data-face="off" aria-pressed="false">Off</button>
      </div>
      <button id="side" class="human-only" title="Switch which half of the face is revealed">Flip side</button>
      <button id="hands" class="human-only" aria-pressed="true">Hands</button>
      <button id="body" class="human-only" aria-pressed="false">Body</button>
      <div class="segmented animal-only" role="group" aria-label="Species" hidden>
        <button data-species="auto" aria-pressed="true">Auto</button>
        <button data-species="dog" aria-pressed="false">Dog</button>
        <button data-species="cat" aria-pressed="false">Cat</button>
      </div>
      <button id="flip" hidden title="Switch between the front and rear camera">Flip camera</button>
      <button id="labelsToggle" aria-pressed="true">Labels</button>
    </nav>

    <footer id="credit">Bone models: BodyParts3D © DBCLS, CC BY-SA 2.1 JP</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
